<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Rollenspiel</title>
<style>
  :root { --bg:#14110f; --panel:#201b17; --panel2:#2a231d; --line:#3a3027; --text:#eadfce; --dim:#9c8f7c; --accent:#d9a441; --err:#e07a6b; --ok:#8fbf7a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width:1280px; margin:0 auto; padding:18px 14px 60px; }
  h1 { color:var(--accent); font-size:1.6rem; margin:0 0 14px; }
  h2 { color:var(--accent); font-size:1rem; margin:0 0 10px; font-weight:normal; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .card { background:var(--panel); border-radius:10px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:var(--dim); margin:8px 0 4px; }
  input[type=password], input[type=text], select { width:100%; padding:10px; border-radius:6px; border:1px solid #4a3f33; background:#14110f; color:var(--text); font:inherit; font-size:1rem; }
  input[type=file] { color:var(--dim); font-size:.9rem; }
  button { font:inherit; font-size:.95rem; cursor:pointer; border:1px solid var(--accent); background:transparent; color:var(--accent); padding:8px 14px; border-radius:6px; margin:8px 8px 0 0; }
  button:hover:not(:disabled) { background:var(--accent); color:#14110f; }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; flex-wrap:wrap; }

  /* Hauptfenster: Ressourcenleiste oben, darunter Erzählbereich und Charakter-Spalte */
  #resBar { padding:10px 14px; }
  #pRes { display:flex; flex-wrap:wrap; gap:10px 24px; }
  #pRes .res { flex:1 1 150px; min-width:130px; margin:0; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start; }
  .side { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; }
  .center { min-width:0; }
  @media (max-width:980px) {
    .layout { grid-template-columns:1fr; }
    .side { position:static; max-height:none; }
  }

  /* Geschichte */
  #log { position:relative; max-height:calc(100vh - 400px); min-height:240px; overflow-y:auto; padding-right:6px; }
  #log p { margin:0 0 14px; color:var(--dim); }
  #log p.last { color:var(--text); }
  .evbox { margin:0 0 16px; padding:4px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; font-family:system-ui, sans-serif; font-size:.85rem; color:var(--dim); }
  .evbox summary { cursor:pointer; color:var(--accent); padding:4px 0; }
  .evbox .evl { padding:6px 0; border-top:1px solid var(--line); color:var(--text); }
  .evbox .evl.pos { color:var(--ok); }
  .evbox .evl.neg { color:var(--err); }
  .evbox .evl.warn { color:var(--err); font-weight:bold; }
  .evbox .evd { margin:2px 0 0 16px; font-size:.8rem; font-weight:normal; color:var(--dim); }
  #options button { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0 0; }
  #options .opt { display:flex; gap:8px; align-items:stretch; margin-top:8px; }
  #options .opt button { margin:0; }
  #options .opt button.speak { width:auto; flex:0 0 auto; text-align:center; }
  #options .end { color:var(--err); margin:0; }
  #freeRow { display:flex; gap:8px; margin-top:12px; }
  #freeRow button { margin:0; }
  #status { min-height:1.4em; color:var(--dim); font-size:.9rem; margin-top:8px; }
  #status.err { color:var(--err); }

  /* Charakterbögen */
  .res { margin-bottom:10px; font-family:system-ui, sans-serif; font-size:.9rem; }
  .res .rh { display:flex; justify-content:space-between; gap:8px; }
  .res.zero .rh { color:var(--err); }
  .bar { height:8px; background:#14110f; border-radius:4px; margin-top:3px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; transition:width .4s; }
  .res small { color:var(--dim); }
  .val { display:flex; align-items:center; gap:8px; font-family:system-ui, sans-serif; font-size:.88rem; margin-bottom:5px; }
  .val span { flex:1 1 auto; }
  .val b { width:1.6em; text-align:right; font-weight:normal; color:var(--accent); }
  .pips { flex:0 0 80px; display:grid; grid-template-columns:repeat(10,1fr); gap:1px; }
  .pips i { height:7px; background:#14110f; }
  .pips i.on { background:var(--accent); }
  .flaw { font-size:.88rem; margin:0 0 8px; padding-left:10px; border-left:2px solid var(--err); }
  .item { display:flex; align-items:center; gap:8px; font-family:system-ui, sans-serif; font-size:.88rem; padding:5px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .nm { flex:1 1 auto; }
  .item .nm small { display:block; color:var(--dim); }
  .item button { margin:0; padding:3px 8px; font-size:.8rem; }
  .empty { color:var(--dim); font-size:.85rem; font-family:system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1 id="title">KI-Rollenspiel</h1>

  <section id="setup" class="card">
    <label for="key">Gemini API-Key (wird nur lokal in deinem Browser gespeichert)</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <div class="row">
      <button id="saveKey">Key speichern</button>
      <button id="clearKey">Key löschen</button>
    </div>
    <label for="gameSel">Spiel auswählen</label>
    <select id="gameSel"></select>
    <label for="file">Weitere Spiele laden (JSON-Datei)</label>
    <input id="file" type="file" accept=".json,application/json">
    <div class="row"><button id="start">Neues Spiel starten</button><button id="resume" hidden>Gespeicherten Stand laden</button></div>
  </section>

  <div id="game" hidden>
    <section class="card" id="resBar"><div id="pRes"></div></section>
    <div class="layout">

      <div class="center">
        <section class="card">
          <div id="log"></div>
          <div id="status"></div>
        </section>
        <section class="card">
          <div id="options"></div>
          <div id="freeRow">
            <input id="free" type="text" placeholder="Eigene Aktion eingeben …" aria-label="Eigene Aktion">
            <button id="freeGo">Los</button>
          </div>
        </section>
        <div class="row">
          <button id="mute" title="Sprachausgabe an/aus">🔊 Sprache an</button>
          <button id="replay">🔁 Nochmal vorlesen</button>
          <button id="save">💾 Fortschritt speichern</button>
          <button id="restart">Neu starten</button>
        </div>
      </div>

      <aside class="side">
        <section class="card"><h2>Stats</h2><div id="pStats"></div></section>
        <section class="card"><h2>Skills</h2><div id="pSkills"></div></section>
        <section class="card"><h2>Flaws</h2><div id="pFlaws"></div></section>
        <section class="card"><h2>Inventar</h2><div id="pInv"></div></section>
      </aside>

    </div>
  </div>
</main>

<script>
const LS_KEY = 'gemini_api_key';
const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
const MEMORY_LIMIT = 8000;          // max. Zeichen im Memory
const MAX_TOOL_ROUNDS = 10;         // max. Funktionsrunden pro Spielzug
const PALETTE = ['#c8503c', '#5b7fd6', '#d9a441', '#6fae7a', '#a874c9'];
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

let games = [];       // alle Spiele aus der JSON
let cfg = null;       // gewähltes Spiel
let st = null;        // Spielzustand: res, stats, skills, flaws, inv, xp, gameover
let memory = '';      // Memory: komprimierter Verlauf
let turn = 0;         // Anzahl bisheriger Spielzüge
let current = null;   // letzte KI-Antwort {story, optionen, events}
let turnEvents = [];  // Ereignisse (Würfe, Änderungen) des laufenden Zuges
let busy = false;
let muted = false;

/* ---------- Konfiguration ---------- */
const lowerKeys = o => { const r = {}; for (const k in o) r[k.toLowerCase()] = o[k]; return r; };
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

// Listen dürfen als Array (Strings oder Objekte) oder als Objekt {"Name": Wert} angegeben werden
function toList(x, valueKey = 'wert') {
  if (!x) return [];
  if (Array.isArray(x)) return x.map(i => typeof i === 'string' ? { name: i } : lowerKeys(i));
  return Object.entries(x).map(([name, v]) => (v && typeof v === 'object') ? { name, ...lowerKeys(v) } : { name, [valueKey]: v });
}

function normalize(obj) {
  const o = lowerKeys(obj);
  if (!o.instructions || !o.startconditions) throw new Error('JSON braucht "instructions" und "startconditions".');
  o.memoryresend = Math.max(1, parseInt(o.memoryresend) || 3);
  o.xpprolevel = Math.max(1, parseInt(o.xpprolevel) || 100);
  o.freitext = o.freitext !== false;
  o.ressourcen = toList(o.ressourcen, 'start').filter(r => r.name || r.id).map((r, i) => {
    const max = (r.max === undefined || r.max === null || r.max === '') ? null : +r.max;
    let start = Number.isFinite(+r.start) ? +r.start : (max ?? 10);
    if (max != null) start = Math.min(start, max);
    return {
      id: slug(r.id || r.name), name: r.name || r.id, icon: r.icon || '', start, max,
      bei_null: r.bei_null || '', ende: !!r.ende, farbe: r.farbe || PALETTE[i % PALETTE.length]
    };
  });
  const rating = x => toList(x).filter(i => i.name).map(i => ({ name: i.name, wert: clamp(Math.round(+i.wert || 0), 0, 10) }));
  o.stats = rating(o.stats);
  o.skills = rating(o.skills);
  o.flaws = toList(o.flaws).map(f => [f.name || f.text, f.beschreibung || f.wert].filter(Boolean).join(' – ')).filter(Boolean);
  o.inventar = toList(o.inventar, 'menge').filter(i => i.name).map(i => ({
    name: i.name, menge: Math.max(1, parseInt(i.menge) || 1), beschreibung: i.beschreibung || ''
  }));
  return o;
}
function parseGames(data) {          // Liste von Spielen oder {"spiele":[...]} oder einzelnes Spiel
  const arr = Array.isArray(data) ? data : (data.spiele || data.games || [data]);
  return arr.map(normalize);
}
async function loadConfig() {
  const name = new URLSearchParams(location.search).get('game') || 'game.json';
  const res = await fetch(name, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Konnte ${name} nicht laden (HTTP ${res.status}).`);
  setGames(parseGames(await res.json()));
}
function setGames(list) {
  if (!list.length) throw new Error('Keine Spiele in der JSON gefunden.');
  games = list;
  const sel = $('gameSel');
  sel.innerHTML = '';
  games.forEach((g, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = g.titel || g.title || `Spiel ${i + 1}`;
    sel.appendChild(o);
  });
  chooseGame();
}
function chooseGame() {
  if (!games.length) return;
  cfg = games[+$('gameSel').value || 0];
  $('title').textContent = cfg.titel || cfg.title || 'KI-Rollenspiel';
  document.title = $('title').textContent;
  $('resume').hidden = !hasSave();
}

/* ---------- Sprachausgabe ---------- */
function speak(text, force) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if ((muted && !force) || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = cfg.sprache || 'de-DE';
  const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith(u.lang.slice(0, 2)));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function speechText(r) {
  return r.story + ' ... Deine Optionen: ' + r.optionen.map((o, i) => `Option ${i + 1}: ${o}.`).join(' ');
}

/* ---------- Spielzustand ---------- */
function initState() {
  st = {
    res: {},
    stats: cfg.stats.map(s => ({ ...s })),
    skills: cfg.skills.map(s => ({ ...s })),
    flaws: [...cfg.flaws],
    inv: cfg.inventar.map(i => ({ ...i })),
    xp: 0,
    gameover: false
  };
  cfg.ressourcen.forEach(r => { st.res[r.id] = r.start; });
}
const level = () => 1 + Math.floor(st.xp / cfg.xpprolevel);

function findByName(list, q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return null;
  return list.find(i => i.name.toLowerCase() === q)
      || list.find(i => i.name.toLowerCase().includes(q) || q.includes(i.name.toLowerCase())) || null;
}
function findRes(q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return null;
  return cfg.ressourcen.find(r => r.id === q || r.name.toLowerCase() === q)
      || cfg.ressourcen.find(r => r.name.toLowerCase().includes(q) || q.includes(r.name.toLowerCase())) || null;
}
function addEvent(t, k, d) { turnEvents.push({ t, k: k || 'info', d: d || [] }); }

/* ---------- Werkzeuge, die die KI aufrufen kann ---------- */
const TOOLS = {
  status_abfragen() {
    return {
      ressourcen: cfg.ressourcen.map(r => ({ id: r.id, name: r.name, wert: st.res[r.id], max: r.max, wenn_null: r.bei_null || 'keine Regel' })),
      xp: st.xp, level: level(), xp_bis_naechstes_level: cfg.xpprolevel - (st.xp % cfg.xpprolevel),
      stats: st.stats, skills: st.skills, flaws: st.flaws,
      inventar: st.inv.map(i => ({ name: i.name, menge: i.menge, beschreibung: i.beschreibung })),
      spiel_beendet: st.gameover
    };
  },

  probe(a) {
    const sk = a.skill ? findByName(st.skills, a.skill) : null;
    const sa = a.stat ? findByName(st.stats, a.stat) : null;
    if (a.skill && !sk) return { fehler: `Skill "${a.skill}" existiert nicht.`, verfuegbar: st.skills.map(s => s.name) };
    if (a.stat && !sa) return { fehler: `Stat "${a.stat}" existiert nicht.`, verfuegbar: st.stats.map(s => s.name) };
    if (!sk && !sa) return { fehler: 'Gib einen skill und/oder einen stat an.' };
    const diff = clamp(Math.round(+a.schwierigkeit || 10), 1, 25);
    const skPart = sk ? sk.wert : 0;
    const saPart = sa ? (sk ? Math.floor(sa.wert / 2) : sa.wert) : 0;
    const mod = clamp(Math.round(+a.modifikator) || 0, -10, 10);
    const bonus = skPart + saPart + mod;
    const wurf = 1 + Math.floor(Math.random() * 10);
    const summe = wurf + bonus;
    const kritisch = wurf === 10 ? 'kritischer Erfolg' : wurf === 1 ? 'Patzer' : null;
    const erfolg = wurf === 10 ? true : wurf === 1 ? false : summe >= diff;
    const label = [sk && `${sk.name} ${sk.wert}`, sa && `${sa.name} ${sa.wert}`].filter(Boolean).join(' + ');
    const detail = [`Schwierigkeit: ${diff}`];
    if (sk) detail.push(`Skill ${sk.name}: +${skPart}`);
    if (sa) detail.push(sk ? `Stat ${sa.name} ${sa.wert}: +${saPart} (halber Wert)` : `Stat ${sa.name}: +${saPart}`);
    if (mod) detail.push(`${mod > 0 ? 'Bonus' : 'Malus'}: ${mod > 0 ? '+' : ''}${mod}${a.modifikator_grund ? ' (' + a.modifikator_grund + ')' : ''}`);
    detail.push(`Wurf W10: ${wurf}${kritisch ? ' – ' + kritisch : ''}`);
    detail.push(`Summe: ${wurf} + ${bonus} = ${summe} → ${erfolg ? 'Erfolg' : 'Fehlschlag'}`);
    addEvent(`🎲 ${a.grund || label}: ${erfolg ? 'Erfolg' : 'Fehlschlag'} (${summe} gegen ${diff})`, erfolg ? 'pos' : 'neg', detail);
    return { wurf, bonus, modifikator: mod, summe, schwierigkeit: diff, erfolg, kritisch, hinweis: 'Erzähle das Ergebnis ehrlich; berücksichtige passende Flaws.' };
  },

  ressource_aendern(a) {
    const r = findRes(a.ressource);
    if (!r) return { fehler: `Ressource "${a.ressource}" existiert nicht.`, verfuegbar: cfg.ressourcen.map(x => x.name) };
    const d = Math.round(+a.delta);
    if (!Number.isFinite(d)) return { fehler: 'delta muss eine ganze Zahl sein.' };
    const alt = st.res[r.id];
    let neu = Math.max(0, alt + d);
    if (r.max != null) neu = Math.min(r.max, neu);
    st.res[r.id] = neu;
    addEvent(`${r.icon ? r.icon + ' ' : ''}${r.name}: ${alt} → ${neu}${a.grund ? ' (' + a.grund + ')' : ''}`, neu < alt ? 'neg' : 'pos');
    const out = { ressource: r.name, alt, neu, max: r.max };
    if (neu === 0 && d < 0) {
      out.null_erreicht = true;
      out.regel = r.bei_null || 'keine besondere Regel';
      addEvent(`⚠ ${r.name} ist auf 0 gefallen!`, 'warn');
      if (r.ende) {
        st.gameover = true;
        out.spielende = true;
        out.hinweis = 'Das Spiel ist vorbei. Erzähle jetzt das Ende; die Optionen werden ignoriert.';
      } else {
        out.hinweis = 'Setze die genannte Regel in der Geschichte um.';
      }
    }
    renderPanels();
    return out;
  },

  xp_vergeben(a) {
    const m = Math.round(+a.menge);
    if (!(m > 0)) return { fehler: 'menge muss eine positive ganze Zahl sein.' };
    const alt = level();
    st.xp += m;
    addEvent(`⭐ +${m} XP${a.grund ? ' (' + a.grund + ')' : ''}`, 'pos');
    const out = { xp: st.xp, level: level() };
    if (level() > alt) {
      out.levelaufstieg = true;
      out.hinweis = 'Level-Aufstieg! Erzähle ihn und verbessere ggf. einen Stat oder Skill mit wert_aendern.';
      addEvent(`🎉 Level ${level()} erreicht!`, 'pos');
    }
    renderPanels();
    return out;
  },

  item_hinzufuegen(a) {
    const name = String(a.name || '').trim();
    const n = Math.max(1, Math.round(+a.menge) || 1);
    if (!name) return { fehler: 'name fehlt.' };
    const ex = findByName(st.inv, name);
    if (ex && ex.name.toLowerCase() === name.toLowerCase()) { ex.menge += n; if (a.beschreibung) ex.beschreibung = a.beschreibung; }
    else st.inv.push({ name, menge: n, beschreibung: a.beschreibung || '' });
    addEvent(`🎒 + ${n}× ${name}`, 'pos');
    renderPanels();
    return { ok: true, name, menge_gesamt: findByName(st.inv, name).menge };
  },

  item_entfernen(a) {
    const it = findByName(st.inv, a.name);
    if (!it) return { fehler: `"${a.name}" ist nicht im Inventar.`, inventar: st.inv.map(i => i.name) };
    const n = Math.max(1, Math.round(+a.menge) || 1);
    if (n > it.menge) return { fehler: `Nur ${it.menge}× ${it.name} vorhanden.` };
    it.menge -= n;
    if (it.menge === 0) st.inv.splice(st.inv.indexOf(it), 1);
    addEvent(`🎒 − ${n}× ${it.name}`, 'neg');
    renderPanels();
    return { ok: true, name: it.name, menge_uebrig: it.menge };
  },

  wert_aendern(a) {
    const art = String(a.art || '').toLowerCase();
    const list = art === 'stat' ? st.stats : art === 'skill' ? st.skills : null;
    if (!list) return { fehler: 'art muss "stat" oder "skill" sein.' };
    const d = Math.round(+a.delta);
    if (!Number.isFinite(d) || d === 0) return { fehler: 'delta muss eine ganze Zahl ungleich 0 sein.' };
    let it = findByName(list, a.name);
    if (!it) {
      if (art === 'skill' && d > 0) { it = { name: String(a.name).trim(), wert: 0 }; list.push(it); }
      else return { fehler: `"${a.name}" existiert nicht.`, verfuegbar: list.map(x => x.name) };
    }
    const alt = it.wert;
    it.wert = clamp(alt + d, 0, 10);
    addEvent(`📈 ${it.name}: ${alt} → ${it.wert}${a.grund ? ' (' + a.grund + ')' : ''}`, it.wert < alt ? 'neg' : 'pos');
    renderPanels();
    return { name: it.name, alt, neu: it.wert };
  },

  flaw_aendern(a) {
    const text = String(a.text || '').trim();
    if (!text) return { fehler: 'text fehlt.' };
    if (a.aktion === 'entfernen') {
      const i = st.flaws.findIndex(f => f.toLowerCase().includes(text.toLowerCase()));
      if (i < 0) return { fehler: 'Flaw nicht gefunden.', flaws: st.flaws };
      addEvent(`🩹 Flaw entfernt: ${st.flaws[i]}`, 'pos');
      st.flaws.splice(i, 1);
    } else {
      st.flaws.push(text);
      addEvent(`🩸 Neuer Flaw: ${text}`, 'neg');
    }
    renderPanels();
    return { ok: true, flaws: st.flaws };
  }
};

const S = d => ({ type: 'STRING', description: d });
const N = d => ({ type: 'INTEGER', description: d });
const functionDeclarations = [
  { name: 'status_abfragen', description: 'Liefert den kompletten Spielzustand: Ressourcen (mit Regeln bei Wert 0), XP, Level, Stats, Skills, Flaws, Inventar.' },
  { name: 'probe', description: 'Würfelprobe (W10 + Skill + halber Stat + Modifikator gegen Schwierigkeit). Die App würfelt, nicht du.',
    parameters: { type: 'OBJECT', properties: {
      skill: S('Name eines Skills (optional)'), stat: S('Name eines Stats (optional)'),
      schwierigkeit: N('1–25: 6 leicht, 10 mittel, 14 schwer, 18 extrem'), grund: S('Kurz, worum es geht'),
      modifikator: N('Situativer Bonus (+) oder Malus (−) von −10 bis +10, z. B. durch Flaws, Ausrüstung oder Umstände'),
      modifikator_grund: S('Begründung des Modifikators')
    }, required: ['schwierigkeit'] } },
  { name: 'ressource_aendern', description: 'Ändert eine Ressource (Leben, Mana, Geld …) relativ um delta. Die App meldet, wenn der Wert 0 erreicht.',
    parameters: { type: 'OBJECT', properties: {
      ressource: S('Name oder id der Ressource'), delta: N('Änderung, negativ für Verlust'), grund: S('Kurzer Grund')
    }, required: ['ressource', 'delta'] } },
  { name: 'xp_vergeben', description: 'Vergibt Erfahrungspunkte für Erfolge, kluge Ideen oder Entdeckungen.',
    parameters: { type: 'OBJECT', properties: { menge: N('Positive Zahl, meist 5–30'), grund: S('Kurzer Grund') }, required: ['menge'] } },
  { name: 'item_hinzufuegen', description: 'Legt einen Gegenstand ins Inventar.',
    parameters: { type: 'OBJECT', properties: { name: S('Gegenstandsname'), menge: N('Anzahl, Standard 1'), beschreibung: S('Kurze Beschreibung') }, required: ['name'] } },
  { name: 'item_entfernen', description: 'Entfernt oder verbraucht einen Gegenstand aus dem Inventar.',
    parameters: { type: 'OBJECT', properties: { name: S('Gegenstandsname'), menge: N('Anzahl, Standard 1') }, required: ['name'] } },
  { name: 'wert_aendern', description: 'Verändert einen Stat oder Skill dauerhaft (Bereich 0–10). Neue Skills können durch positives delta gelernt werden.',
    parameters: { type: 'OBJECT', properties: {
      art: { type: 'STRING', enum: ['stat', 'skill'] }, name: S('Name'), delta: N('Änderung, meist +1 oder −1'), grund: S('Kurzer Grund')
    }, required: ['art', 'name', 'delta'] } },
  { name: 'flaw_aendern', description: 'Fügt einen Flaw (Nachteil als Freitext) hinzu oder entfernt ihn.',
    parameters: { type: 'OBJECT', properties: {
      aktion: { type: 'STRING', enum: ['hinzufuegen', 'entfernen'] }, text: S('Text des Flaws')
    }, required: ['aktion', 'text'] } },
  { name: 'antworten', description: 'Beendet den Spielzug: Erzählabschnitt und genau 3 Handlungsoptionen für den Spieler. Muss am Ende jeder Runde aufgerufen werden.',
    parameters: { type: 'OBJECT', properties: {
      story: S('Der Erzähltext dieser Runde'),
      optionen: { type: 'ARRAY', items: { type: 'STRING' }, minItems: 3, maxItems: 3, description: 'Genau 3 kurze Handlungsoptionen' }
    }, required: ['story', 'optionen'] } }
];

const RPG_RULES = `SPIELREGELN (Rollenspiel-Engine):
- Der Spielzustand (Ressourcen, XP, Stats, Skills, Flaws, Inventar) liegt in der Spiel-App. Rufe zu Beginn jeder Runde status_abfragen auf, wenn du ihn nicht sicher kennst. Erfinde niemals Werte.
- Änderungen geschehen NUR über Funktionen: ressource_aendern, xp_vergeben, item_hinzufuegen, item_entfernen, wert_aendern, flaw_aendern.
- Bei Handlungen mit unsicherem Ausgang rufe probe auf (die App würfelt) und erzähle das Ergebnis ehrlich. Lasse Flaws spürbar in die Geschichte einfließen. Situative Boni und Mali (z. B. durch Flaws, Ausrüstung, Umstände) übergibst du über modifikator und modifikator_grund.
- Der Spieler kann nur Gegenstände nutzen, die im Inventar sind. Verbrauchte Gegenstände entfernst du mit item_entfernen.
- Meldet eine Funktion, dass eine Ressource auf 0 gefallen ist, setze die dort genannte Regel in der Geschichte um.
- Vergib XP für Erfolge, kluge Ideen und Entdeckungen.
- Beende JEDE Runde mit der Funktion antworten (story + genau 3 Optionen). Das ist der einzige Weg, dem Spieler zu antworten; schreibe keinen freien Text. Die Vorgaben zu Stil und Optionen aus der Spielbeschreibung gelten weiterhin.`;

/* ---------- Gemini ---------- */
async function runTurn(prompt) {
  const key = localStorage.getItem(LS_KEY);
  if (!key) throw new Error('Bitte zuerst einen API-Key speichern.');
  const model = cfg.model || DEFAULT_MODEL;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const contents = [{ role: 'user', parts: [{ text: prompt }] }];

  for (let round = 0; round < MAX_TOOL_ROUNDS; round++) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: cfg.instructions + '\n\n' + RPG_RULES }] },
        contents,
        tools: [{ functionDeclarations }],
        toolConfig: { functionCallingConfig: { mode: 'ANY' } },
        generationConfig: { temperature: cfg.temperature ?? 1 }
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `API-Fehler ${res.status}`);
    const content = data.candidates?.[0]?.content;
    const calls = (content?.parts || []).filter(p => p.functionCall);
    if (!calls.length) throw new Error('Keine verwertbare Antwort (evtl. durch Sicherheitsfilter blockiert).');
    contents.push(content);   // unverändert zurückgeben (inkl. evtl. Gedanken-Signaturen)

    let final = null;
    const responses = [];
    for (const p of calls) {
      const { name, args = {} } = p.functionCall;
      if (name === 'antworten') {
        final = args;
        responses.push({ functionResponse: { name, response: { ok: true } } });
        continue;
      }
      let result;
      try { result = TOOLS[name] ? TOOLS[name](args) : { fehler: 'Unbekannte Funktion ' + name }; }
      catch (e) { result = { fehler: e.message }; }
      responses.push({ functionResponse: { name, response: result } });
    }
    if (final) {
      if (!final.story || !Array.isArray(final.optionen) || final.optionen.length < 3)
        throw new Error('Antwort entspricht nicht dem Schema.');
      final.optionen = final.optionen.slice(0, 3);
      return final;
    }
    contents.push({ role: 'user', parts: responses });
  }
  throw new Error('Zu viele Funktionsaufrufe ohne Antwort.');
}

/* ---------- Anzeige der Charakterbögen ---------- */
function valueRows(box, list) {
  box.innerHTML = '';
  if (!list.length) { box.append(el('div', 'empty', '–')); return; }
  list.forEach(i => {
    const row = el('div', 'val');
    const pips = el('div', 'pips');
    for (let n = 1; n <= 10; n++) pips.append(el('i', n <= i.wert ? 'on' : ''));
    row.append(el('span', '', i.name), pips, el('b', '', i.wert));
    box.append(row);
  });
}
function renderPanels() {
  if (!st) return;
  const rp = $('pRes');
  rp.innerHTML = '';
  cfg.ressourcen.forEach(r => {
    const v = st.res[r.id];
    const row = el('div', 'res' + (v === 0 ? ' zero' : ''));
    const head = el('div', 'rh');
    head.append(el('span', '', (r.icon ? r.icon + ' ' : '') + r.name), el('b', '', r.max != null ? `${v} / ${r.max}` : String(v)));
    row.append(head);
    if (r.max != null) {
      const bar = el('div', 'bar'), fill = el('i');
      fill.style.width = (r.max ? v / r.max * 100 : 0) + '%';
      fill.style.background = r.farbe;
      bar.append(fill); row.append(bar);
    }
    rp.append(row);
  });
  // XP und Level (fest eingebaut)
  const per = cfg.xpprolevel, inLvl = st.xp % per;
  const xrow = el('div', 'res'), xh = el('div', 'rh');
  xh.append(el('span', '', `⭐ Level ${level()}`), el('b', '', `${st.xp} XP`));
  const xbar = el('div', 'bar'), xfill = el('i');
  xfill.style.width = (inLvl / per * 100) + '%';
  xfill.style.background = 'var(--accent)';
  xbar.append(xfill);
  xrow.append(xh, xbar, el('small', '', `noch ${per - inLvl} XP bis Level ${level() + 1}`));
  rp.append(xrow);

  valueRows($('pStats'), st.stats);
  valueRows($('pSkills'), st.skills);

  const fb = $('pFlaws');
  fb.innerHTML = '';
  if (!st.flaws.length) fb.append(el('div', 'empty', 'Keine'));
  st.flaws.forEach(f => fb.append(el('p', 'flaw', f)));

  const ib = $('pInv');
  ib.innerHTML = '';
  if (!st.inv.length) ib.append(el('div', 'empty', 'Leer'));
  st.inv.forEach(i => {
    const row = el('div', 'item');
    const nm = el('div', 'nm', i.menge > 1 ? `${i.name} ×${i.menge}` : i.name);
    if (i.beschreibung) nm.append(el('small', '', i.beschreibung));
    const b = el('button', '', 'Benutzen');
    b.disabled = busy || st.gameover || !current;
    b.onclick = () => act('Ich benutze: ' + i.name);
    row.append(nm, b);
    ib.append(row);
  });
}

/* ---------- Spielablauf ---------- */
function setStatus(msg, err) { $('status').textContent = msg || ''; $('status').className = err ? 'err' : ''; }

function buildPrompt(choice, retry) {
  const parts = [];
  // Memory wird nur jedes x-te Mal mitgeschickt
  if (turn % cfg.memoryresend === 0 && memory) parts.push(`GEDÄCHTNIS (bisheriger Spielverlauf, bitte konsistent bleiben):\n${memory}`);
  if (current) parts.push(`Letzter Erzählabschnitt:\n${current.story}`);
  if (choice) parts.push(`Der Spieler wählt: ${choice}\nErzähle, wie es weitergeht.`);
  else parts.push(`Startbedingungen:\n${cfg.startconditions}\nBeginne das Abenteuer.`);
  if (retry) parts.push('HINWEIS: Ein früherer Versuch dieser Runde wurde unterbrochen. Zustandsänderungen wurden eventuell schon ausgeführt – rufe status_abfragen auf, bevor du etwas änderst.');
  return parts.join('\n\n');
}

function lock(on) {
  busy = on;
  document.querySelectorAll('#options button, #freeRow button, #freeRow input').forEach(b => b.disabled = on);
  renderPanels();
}

async function step(choice, retry) {
  $('options').innerHTML = '';
  lock(true);
  setStatus('Der Erzähler denkt nach …');
  turnEvents = [];
  try {
    const prompt = buildPrompt(choice, retry);
    const prev = current;
    const out = await runTurn(prompt);
    out.events = turnEvents.slice();
    if (prev && choice) {
      const folgen = prev.events && prev.events.length ? ` [Folgen: ${prev.events.map(e => e.t).join('; ')}]` : '';
      memory += `\n- ${prev.story.slice(0, 350)}… → Wahl: ${choice}${folgen}`;
    }
    if (memory.length > MEMORY_LIMIT) memory = '…' + memory.slice(-MEMORY_LIMIT);
    turn++;
    current = out;
    busy = false;
    render();
    setStatus('');
  } catch (e) {
    setStatus('Fehler: ' + e.message, true);
    const b = el('button', '', 'Nochmal versuchen');
    b.onclick = () => step(choice, true);
    $('options').appendChild(b);
    busy = false;
    renderPanels();
  }
}

function act(text) {
  text = String(text || '').trim();
  if (busy || !text || !current || st.gameover) return;
  speechSynthesis.cancel();
  $('log').appendChild(el('p', '', '➤ ' + text));
  $('free').value = '';
  step(text);
}

// Aufklappbares Feld unter dem Erzähltext: Würfe, Boni/Mali, Änderungen
function makeEventBox(events) {
  const d = document.createElement('details');
  d.className = 'evbox';
  d._ev = events;
  d.append(el('summary', '', `📋 Würfe & Änderungen (${events.length})`));
  events.forEach(e => {
    const row = el('div', 'evl ' + e.k, e.t);
    (e.d || []).forEach(line => row.append(el('div', 'evd', line)));
    d.append(row);
  });
  return d;
}

function render(resume) {
  const log = $('log');
  if (!resume) log.querySelectorAll('p.last').forEach(p => p.classList.remove('last'));
  let p;
  if (resume) p = log.querySelector('p.last') || log.lastElementChild;
  else {
    p = el('p', 'last', current.story);
    log.appendChild(p);
    if (current.events && current.events.length) log.appendChild(makeEventBox(current.events));
  }
  const box = $('options');
  box.innerHTML = '';
  $('freeRow').hidden = !cfg.freitext || st.gameover;
  if (st.gameover) {
    box.append(el('p', 'end', 'Das Abenteuer ist zu Ende. Über „Neu starten“ beginnst du eine neue Geschichte.'));
  } else {
    current.optionen.forEach((o, i) => {
      const row = el('div', 'opt');
      const b = el('button', '', `${i + 1}. ${o}`);
      b.onclick = () => act(o);
      const s = el('button', 'speak', '🔊');
      s.title = 'Option vorlesen';
      s.setAttribute('aria-label', `Option ${i + 1} vorlesen`);
      s.onclick = () => speak(`Option ${i + 1}: ${o}`, true);
      row.append(b, s);
      box.appendChild(row);
    });
  }
  renderPanels();
  if (p) log.scrollTo({ top: p.offsetTop - 4, behavior: 'smooth' });
  if (!resume) speak(st.gameover ? current.story : speechText(current));
}

function showGame() {
  $('setup').hidden = true;
  $('game').hidden = false;
}

function startGame() {
  chooseGame();
  if (!cfg) return setStatus('Keine Spielkonfiguration geladen.', true);
  if (!localStorage.getItem(LS_KEY)) { alert('Bitte zuerst deinen Gemini API-Key speichern.'); return; }
  speechSynthesis.cancel();
  $('log').innerHTML = '';
  current = null; turn = 0;
  initState();
  memory = `Startbedingungen: ${cfg.startconditions}`;
  showGame();
  renderPanels();
  step(null);
}

/* ---------- Speichern / Fortsetzen ---------- */
const saveSlot = () => 'adventure_save_' + (cfg.titel || cfg.title || 'spiel');
function hasSave() {
  try { return !!localStorage.getItem(saveSlot()); } catch (e) { return false; }
}
function saveProgress() {
  if (!current) return setStatus('Noch nichts zu speichern.', true);
  if (busy) return setStatus('Bitte warten, bis der Erzähler fertig ist.', true);
  const items = Array.from($('log').children).map(n => n._ev ? { c: 'evbox', ev: n._ev } : { c: n.className, t: n.textContent });
  const last = items.map(i => i.c).lastIndexOf('last');   // unbeantwortete Wahl nicht mitspeichern
  let end = last + 1;
  while (items[end] && items[end].c === 'evbox') end++;    // Ereignisfeld der letzten Geschichte mitnehmen
  try {
    localStorage.setItem(saveSlot(), JSON.stringify({ memory, turn, current, st, log: items.slice(0, end) }));
    setStatus('Fortschritt gespeichert ✔');
  } catch (e) { setStatus('Speichern fehlgeschlagen: ' + e.message, true); }
}
function resumeGame() {
  chooseGame();
  if (!localStorage.getItem(LS_KEY)) { alert('Bitte zuerst deinen Gemini API-Key speichern.'); return; }
  try {
    const d = JSON.parse(localStorage.getItem(saveSlot()));
    if (!d.st) throw new Error('Der Stand stammt aus einer älteren Version ohne Charakterdaten.');
    speechSynthesis.cancel();
    memory = d.memory; turn = d.turn; current = d.current; st = d.st;
    const log = $('log');
    log.innerHTML = '';
    d.log.forEach(i => log.appendChild(i.c === 'evbox' ? makeEventBox(i.ev) : el('p', i.c, i.t)));
    showGame();
    setStatus('Stand geladen.');
    render(true);
  } catch (e) { alert('Speicherstand nicht lesbar: ' + e.message); }
}

/* ---------- UI ---------- */
$('key').value = localStorage.getItem(LS_KEY) || '';
$('saveKey').onclick = () => {
  const k = $('key').value.trim();
  if (!k) return;
  localStorage.setItem(LS_KEY, k);
  alert('Key gespeichert.');
};
$('clearKey').onclick = () => { localStorage.removeItem(LS_KEY); $('key').value = ''; };
$('start').onclick = startGame;
$('gameSel').onchange = chooseGame;
$('save').onclick = saveProgress;
$('resume').onclick = resumeGame;
$('restart').onclick = () => { speechSynthesis.cancel(); $('game').hidden = true; $('setup').hidden = false; chooseGame(); };
$('mute').onclick = () => {
  muted = !muted;
  $('mute').textContent = muted ? '🔇 Sprache aus' : '🔊 Sprache an';
  if (muted) speechSynthesis.cancel();
};
$('replay').onclick = () => current && (muted = false, $('mute').textContent = '🔊 Sprache an', speak(speechText(current)));
$('freeGo').onclick = () => act($('free').value);
$('free').onkeydown = e => { if (e.key === 'Enter') act($('free').value); };
$('file').onchange = async e => {
  try {
    setGames(parseGames(JSON.parse(await e.target.files[0].text())));
    alert(games.length + ' Spiel(e) geladen.');
  } catch (err) { alert('Ungültige JSON-Datei: ' + err.message); }
};
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

loadConfig().catch(e => {
  alert(e.message + '\nTipp: Lokal per file:// geht das Laden nicht – nutze einen Webserver oder die Datei-Auswahl.');
});
</script>
