<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Vokabel-Kartenspiel</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; text-align: center; }
  h1 { margin-top: 20px; }
  .area { margin: 20px auto; padding: 10px; max-width: 700px; }
  .stapel-info { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
  .hand { display: flex; justify-content: center; gap: 10px; }
  .karte {
    width: 130px; min-height: 170px; background: #333; border: 2px solid #555;
    border-radius: 8px; padding: 8px; cursor: pointer; transition: transform 0.1s;
  }
  .karte:hover { transform: translateY(-5px); border-color: #7fd; }
  .karte.disabled { opacity: 0.4; cursor: not-allowed; }
  .karte img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; background: #555; }
  .karte .name { font-weight: bold; margin: 6px 0 2px; }
  .karte .staerke { color: #ffd166; }
  .karte .element { font-size: 0.8em; color: #9ad; }
  .karte .flavor { font-size: 0.75em; color: #ccc; margin-top: 4px; }
  .mitte { min-height: 200px; display: flex; justify-content: center; align-items: center; gap: 40px; }
  #log { max-width: 700px; margin: 20px auto; text-align: left; background: #111; padding: 10px;
         border-radius: 6px; height: 150px; overflow-y: auto; font-size: 0.85em; }
  .computer-hand { color: #999; font-style: italic; }
</style>
</head>
<body>

<h1>Vokabel-Kartenspiel</h1>

<div class="area">
  <h2>Computer</h2>
  <div class="stapel-info" id="computer-stapel-info"></div>
  <div class="computer-hand" id="computer-hand-info"></div>
</div>

<div class="mitte" id="mitte"></div>

<div class="area">
  <h2>Spieler</h2>
  <div class="stapel-info" id="player-stapel-info"></div>
  <div class="hand" id="player-hand"></div>
</div>

<div id="log"></div>

<script src="js/game.js"></script>
</body>
</html>
