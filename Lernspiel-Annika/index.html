<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textabenteuer</title>
    <style>
        body { background-color: #1a1a1a; color: #dcdcdc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .game-container { width: 100%; max-width: 950px; background-color: #222222; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); display: grid; grid-template-columns: 1fr 280px; gap: 30px; }
        .story-column { display: flex; flex-direction: column; gap: 20px; }
        .location-image { width: 100%; max-height: 380px; object-fit: cover; border-radius: 6px; border: 1px solid #333; background-color: #111; }
        h1 { color: #2e8b57; font-size: 1.6rem; margin: 0; }
        .story-text { line-height: 1.6; font-size: 1.1rem; margin: 0; white-space: pre-line; }
        .room-items-container { padding: 12px; background-color: #252525; border-left: 3px solid #2e8b57; border-radius: 0 4px 4px 0; font-size: 0.95rem; display: flex; flex-direction: column; gap: 8px; }
        .item-link { color: #4fc985; background: none; border: none; padding: 0; font-family: inherit; font-size: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
        .item-link:hover { color: #7fe0ab; }
        .choices-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .btn-choice { background-color: #2e8b57; color: #ffffff; border: none; padding: 12px 18px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 1rem; font-family: inherit; transition: background-color 0.2s ease; }
        .btn-choice:hover:not(:disabled) { background-color: #3b9c68; }
        .btn-choice:disabled { background-color: #333333; color: #666666; border: 1px dashed #444; cursor: not-allowed; }
        .no-choices-hint { color: #666; font-style: italic; font-size: 0.9rem; margin: 0; }
        .sidebar-column { display: flex; flex-direction: column; gap: 20px; border-left: 1px solid #333; padding-left: 25px; }
        .inventory-box { background-color: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid #444; }
        .inventory-title { font-weight: bold; color: #2e8b57; margin-bottom: 8px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        .inventory-list { font-size: 0.9rem; color: #bbb; line-height: 1.4; }
        .btn-reset { background-color: #2a2a2a; border: 1px solid #555; color: #aaa; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; width: 100%; font-family: inherit; transition: all 0.2s ease; }
        .btn-reset:hover { border-color: #aa3333; color: #ff5555; background-color: #331a1a; }
        @media (max-width: 768px) { .game-container { grid-template-columns: 1fr; } .sidebar-column { border-left: none; border-top: 1px solid #333; padding-left: 0; padding-top: 25px; } }

        /* Buchstaben-Quiz */
        .quiz-box { background-color: #252525; border: 2px solid #2e8b57; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
        .quiz-title { color: #4fc985; font-size: 1.1rem; margin: 0; }
        .quiz-hint { color: #999; font-size: 0.85rem; margin: 0; }
        .quiz-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .quiz-input { width: 70px; text-align: center; font-size: 1.6rem; text-transform: uppercase; font-family: inherit; background-color: #1a1a1a; color: #dcdcdc; border: 1px solid #555; border-radius: 4px; padding: 8px; }
        .btn-quiz, .btn-speak { background-color: #2e8b57; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-family: inherit; transition: background-color 0.2s ease; }
        .btn-quiz:hover, .btn-speak:hover { background-color: #3b9c68; }
        .btn-replay { background-color: #333; color: #dcdcdc; border: 1px solid #555; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        .btn-replay:hover { border-color: #4fc985; color: #4fc985; }
        .quiz-feedback { min-height: 1.2em; font-size: 0.95rem; }
        .quiz-feedback.wrong { color: #ff6b6b; }
        .quiz-feedback.correct { color: #4fc985; }
        .read-controls { display: flex; justify-content: center; margin-bottom: 4px; }
        .btn-speak { font-size: 1.05rem; padding: 12px 20px; }

        /* Namens-Setup */
        .setup-overlay { position: fixed; inset: 0; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 100; }
        .setup-box { background-color: #222222; border: 2px solid #2e8b57; border-radius: 8px; padding: 30px; max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .setup-question { color: #4fc985; font-size: 1.15rem; margin: 0; }
    </style>
</head>
<body>

    <!-- Namens-Setup: wird einmalig vor dem Spielstart abgefragt -->
    <div id="name-setup-overlay" class="setup-overlay">
        <div class="setup-box">
            <p class="setup-question" id="setup-question">Was ist der erste Buchstabe deines Namens?</p>
            <div class="quiz-controls">
                <input type="text" id="setup-input" class="quiz-input" maxlength="1" autocomplete="off" autocapitalize="characters">
                <button type="button" class="btn-quiz" id="setup-submit-btn">Weiter</button>
            </div>
            <p id="setup-feedback" class="quiz-feedback"></p>
        </div>
    </div>

    <div id="main-layout" class="game-container" style="display:none;">
        <div class="story-column" id="story-area">
            <img id="room-image" class="location-image" src="" alt="Location Bild" style="display: none;">
            <h1 id="room-title" style="display:none;">Lade Abenteuer...</h1>
            <p id="room-text" class="story-text" style="display:none;"></p>

            <!-- Buchstaben-Quiz: muss gelöst werden, bevor die Geschichte vorgelesen wird -->
            <div id="quiz-box" class="quiz-box" style="display:none;">
                <p class="quiz-title">🔊 Höre gut zu und tippe den richtigen Buchstaben ein!</p>
                <p class="quiz-hint" id="quiz-hint"></p>
                <div class="quiz-controls">
                    <button type="button" class="btn-replay" id="quiz-replay-btn">🔁 Nochmal hören</button>
                    <input type="text" id="quiz-input" class="quiz-input" maxlength="1" autocomplete="off" autocapitalize="characters">
                    <button type="button" class="btn-quiz" id="quiz-submit-btn">Prüfen</button>
                </div>
                <p id="quiz-feedback" class="quiz-feedback"></p>
            </div>

            <!-- Wird erst nach richtiger Antwort sichtbar -->
            <div id="content-gated" style="display:none; flex-direction: column; gap: 20px;">
                <div class="read-controls">
                    <button type="button" class="btn-speak" id="speak-btn">📖 Geschichte vorlesen</button>
                </div>
                <div id="room-items-container" class="room-items-container" style="display: none;"></div>
                <div id="choices-container" class="choices-container"></div>
            </div>
        </div>

        <!-- Rechts: UI Sidebar -->
        <div class="sidebar-column">
            <!-- Abenteuer-Auswahlmenü -->
            <div class="inventory-box" style="margin-bottom: 0;">
                <div class="inventory-title">🗺️ Abenteuer wählen</div>
                <select id="adventure-select" onchange="window.changeAdventure(this.value)" style="width: 100%; background: #1a1a1a; color: #dcdcdc; border: 1px solid #555; padding: 8px; font-family: inherit; border-radius: 4px; cursor: pointer;">
                    <!-- Value ist genau der Name des Unterordners -->
                    <option value="Abenteuer-Haus">Das Haus</option>
                    <option value="Abenteuer-Weltall">ein neues Abenteuer</option>
                </select>
            </div>

            <div class="inventory-box">
                <div class="inventory-title">🎒 Inventar</div>
                <div id="inventory-list" class="inventory-list">Leer</div>
            </div>
            <button class="btn-reset" onclick="window.resetGame()">🔄 Neustart</button>
        </div>

    </div>

    <script>
        // EINGEBAUTE STANDARD-STORY (Falls abenteuer.json nicht geladen werden kann)
        const defaultAdventure = {
            "1": {
                "title": "Der Eingangsbereich_backup",
                "text": "Du stehst im hellen Flur des Hauses. Von hier aus führen zwei schwere Holztüren in die angrenzenden Räume. Auf der Kommode liegt ein Schlüssel.",
                "image": "eingang.jpg",
                "items": [
                    { "id": "schluessel", "text": "Ein Schlüssel liegt auf der Kommode.", "target": "item_schluessel", "requiredItemNot": "schluessel" }
                ],
                "choices": [
                    { "text": "Gehe in das Wohnzimmer", "target": "2" },
                    { "text": "Schließe die Tür zum Esszimmer auf", "target": "3", "requiredItem": "schluessel" }
                ]
            },
            "item_schluessel": {
                "title": "Der Schlüssel",
                "text": "Ein kleiner, unscheinbarer Schlüssel.",
                "image": "",
                "items": [],
                "choices": [
                    { "text": "Einstecken", "addItem": "schluessel", "target": "1" },
                    { "text": "Liegen lassen", "target": "1" }
                ]
            }
        };

        // Standard-Buchstaben-Wortliste (Falls buchstaben.json nicht geladen werden kann)
        const defaultLetters = {
            "A": ["Apfel", "Ameise", "Auto"], "B": ["Ball", "Baum", "Banane"], "C": ["Clown", "Computer"],
            "D": ["Delfin", "Drache", "Dose"], "E": ["Elefant", "Ente", "Eis"], "F": ["Fisch", "Feuer", "Fuchs"],
            "G": ["Giraffe", "Garten", "Glas"], "H": ["Hund", "Haus", "Hase"], "I": ["Igel", "Insel"],
            "J": ["Jacke", "Junge"], "K": ["Katze", "König", "Kuh"], "L": ["Löwe", "Lampe", "Löffel"],
            "M": ["Maus", "Mond", "Meer"], "N": ["Nase", "Nest", "Netz"], "O": ["Ofen", "Orange", "Ohr"],
            "P": ["Pinguin", "Pilz", "Pferd"], "Q": ["Qualle", "Quark"], "R": ["Rakete", "Ring", "Roboter"],
            "S": ["Sonne", "Schaf", "Stern"], "T": ["Tiger", "Tasse", "Turm"], "U": ["Uhr", "Uhu"],
            "V": ["Vogel", "Vase", "Vater"], "W": ["Wal", "Wolke", "Wasser"], "X": ["Xylophon"],
            "Y": ["Yak", "Yoga"], "Z": ["Zebra", "Zug", "Zahn"]
        };

        // Standard-Mädchennamen (Falls maedchennamen.json nicht geladen werden kann)
        const defaultGirlNames = {
            "A": ["Anna", "Amelie"], "B": ["Bella", "Bianca"], "C": ["Clara", "Charlotte"],
            "D": ["Diana", "Dana"], "E": ["Emma", "Elena"], "F": ["Fiona", "Frieda"],
            "G": ["Greta", "Gina"], "H": ["Hanna", "Helena"], "I": ["Ida", "Ines"],
            "J": ["Julia", "Jana"], "K": ["Klara", "Kim"], "L": ["Lena", "Lisa"],
            "M": ["Mia", "Maria"], "N": ["Nora", "Nina"], "O": ["Olivia"],
            "P": ["Paula", "Pia"], "Q": ["Quinta"], "R": ["Rosa", "Ronja"],
            "S": ["Sophie", "Sarah"], "T": ["Tina", "Theresa"], "U": ["Ulla"],
            "V": ["Vera", "Vicky"], "W": ["Wanda"], "X": ["Xenia"],
            "Y": ["Yara"], "Z": ["Zoe", "Zita"]
        };

        let girlNamesData = defaultGirlNames;
        let playerName = "";
        let girlfriendName = "";

        async function loadGirlNamesFile() {
            try {
                const response = await fetch("maedchennamen.json", { cache: "no-store" });
                if (response.ok) {
                    girlNamesData = JSON.parse(await response.text());
                } else {
                    girlNamesData = defaultGirlNames;
                }
            } catch (e) {
                girlNamesData = defaultGirlNames;
            }
        }

        // Ersetzt Platzhalter {SPIELER} und {FREUNDIN} in Texten durch die gewählten Namen
        function replacePlaceholders(text) {
            if (!text) return text;
            return text.split("{SPIELER}").join(playerName).split("{FREUNDIN}").join(girlfriendName);
        }

        // ---------------------------------------------------------------
        // Namens-Setup: fragt vor Spielstart nach dem ersten Buchstaben
        // des eigenen Namens und dem der Freundin
        // ---------------------------------------------------------------
        let setupStep = 1; // 1 = eigener Name, 2 = Name der Freundin

        // Spricht die Begrüßung und wartet danach eine kurze Pause, bevor es weitergeht
        function speakGreetingThen(callback) {
            const overlay = document.getElementById("name-setup-overlay");
            const box = overlay ? overlay.querySelector(".setup-box") : null;
            if (box) {
                box.innerHTML = '<p class="setup-question">👋 Hallo ' + playerName + '!</p>';
            }
            if (overlay) overlay.style.display = "flex";
            const mainLayout = document.getElementById("main-layout");
            if (mainLayout) mainLayout.style.display = "none";

            speak("Hallo " + playerName + ".", function () {
                setTimeout(function () {
                    if (overlay) overlay.style.display = "none";
                    if (mainLayout) mainLayout.style.display = "grid";
                    callback();
                }, 1500); // zusätzliche Pause nach der Begrüßung
            });
        }

        function runNameSetup(onComplete) {
            const savedPlayer = localStorage.getItem("vibe_player_name");
            const savedGirlfriend = localStorage.getItem("vibe_girlfriend_name");
            if (savedPlayer && savedGirlfriend) {
                playerName = savedPlayer;
                girlfriendName = savedGirlfriend;
                speakGreetingThen(onComplete);
                return;
            }

            setupStep = 1;
            const questionEl = document.getElementById("setup-question");
            const inputEl = document.getElementById("setup-input");
            const feedbackEl = document.getElementById("setup-feedback");
            const submitBtn = document.getElementById("setup-submit-btn");

            questionEl.textContent = "Was ist der erste Buchstabe deines Namens?";
            inputEl.value = "";
            feedbackEl.textContent = "";

            function handleSubmit() {
                const answer = (inputEl.value || "").trim().toUpperCase();
                if (!answer || answer.length !== 1 || !/[A-ZÄÖÜ]/.test(answer)) {
                    feedbackEl.textContent = "Bitte gib einen Buchstaben ein.";
                    feedbackEl.className = "quiz-feedback wrong";
                    return;
                }

                if (setupStep === 1) {
                    const options = girlNamesData[answer] && girlNamesData[answer].length > 0
                        ? girlNamesData[answer]
                        : [answer]; // Fallback: einfach der Buchstabe, falls kein Name gefunden wird
                    playerName = pickRandom(options);
                    localStorage.setItem("vibe_player_name", playerName);

                    setupStep = 2;
                    questionEl.textContent = "Was ist der erste Buchstabe des Namens deiner Freundin?";
                    inputEl.value = "";
                    feedbackEl.textContent = "";
                    inputEl.focus();
                } else {
                    girlfriendName = answer + "eppa";
                    localStorage.setItem("vibe_girlfriend_name", girlfriendName);
                    speakGreetingThen(onComplete);
                }
            }

            submitBtn.onclick = handleSubmit;
            inputEl.onkeydown = function (e) { if (e.key === "Enter") handleSubmit(); };
            inputEl.focus();
        }

        // Standard-Einstellungen
        let currentAdventureFolder = "Abenteuer-Haus";
        let adventureData = defaultAdventure;
        let lettersData = defaultLetters;
        let gameState = { currentRoom: "1", inventory: [], flags: {} };
        let quizSolvedForCurrentRoom = false;
        let currentQuizLetter = "";
        let currentQuizWord = "";
        let pendingSpeechTitle = "";
        let pendingSpeechText = "";

        // ---------------------------------------------------------------
        // Sprachausgabe (Web Speech API)
        // ---------------------------------------------------------------
        function speak(text, onEnd) {
            if (!("speechSynthesis" in window) || !text) {
                if (onEnd) onEnd();
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "de-DE";
            utterance.rate = 0.95;
            let finished = false;
            const finish = function () {
                if (finished) return;
                finished = true;
                if (onEnd) onEnd();
            };
            utterance.onend = finish;
            utterance.onerror = finish;
            // Sicherheitsnetz, falls das onend-Event im Browser nicht zuverlässig feuert
            const fallbackMs = Math.max(1500, text.length * 90);
            setTimeout(finish, fallbackMs);
            window.speechSynthesis.speak(utterance);
        }

        // ---------------------------------------------------------------
        // Buchstaben-Quiz
        // ---------------------------------------------------------------
        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startNewQuiz() {
            quizSolvedForCurrentRoom = false;
            const letters = Object.keys(lettersData).filter(function (l) {
                return lettersData[l] && lettersData[l].length > 0;
            });
            const letter = pickRandom(letters);
            const word = pickRandom(lettersData[letter]);
            currentQuizLetter = letter;
            currentQuizWord = word;

            const quizBox = document.getElementById("quiz-box");
            const gated = document.getElementById("content-gated");
            const input = document.getElementById("quiz-input");
            const feedback = document.getElementById("quiz-feedback");
            if (quizBox) quizBox.style.display = "flex";
            if (gated) gated.style.display = "none";
            if (input) { input.value = ""; }
            if (feedback) { feedback.textContent = ""; feedback.className = "quiz-feedback"; }

            speak(letter + " - wie " + word + ".");

            if (input) {
                setTimeout(function () { input.focus(); }, 300);
            }
        }

        function checkQuizAnswer() {
            const input = document.getElementById("quiz-input");
            const feedback = document.getElementById("quiz-feedback");
            if (!input) return;
            const answer = (input.value || "").trim().toUpperCase();

            if (answer === currentQuizLetter) {
                quizSolvedForCurrentRoom = true;
                if (feedback) { feedback.textContent = "Richtig! Sehr gut! 🎉"; feedback.className = "quiz-feedback correct"; }
                setTimeout(function () {
                    const quizBox = document.getElementById("quiz-box");
                    const gated = document.getElementById("content-gated");
                    if (quizBox) quizBox.style.display = "none";
                    if (gated) gated.style.display = "flex";
                    speak(pendingSpeechTitle + ". " + pendingSpeechText);
                }, 700);
            } else {
                if (feedback) { feedback.textContent = "Das war noch nicht richtig. Hör nochmal genau hin!"; feedback.className = "quiz-feedback wrong"; }
                input.value = "";
                input.focus();
            }
        }

        window.addEventListener("DOMContentLoaded", function () {
            const submitBtn = document.getElementById("quiz-submit-btn");
            const replayBtn = document.getElementById("quiz-replay-btn");
            const speakBtn = document.getElementById("speak-btn");
            const input = document.getElementById("quiz-input");

            if (submitBtn) submitBtn.addEventListener("click", checkQuizAnswer);
            if (input) input.addEventListener("keydown", function (e) {
                if (e.key === "Enter") checkQuizAnswer();
            });
            if (replayBtn) replayBtn.addEventListener("click", function () {
                if (currentQuizLetter && currentQuizWord) {
                    speak(currentQuizLetter + " - wie " + currentQuizWord + ".");
                }
            });
            if (speakBtn) speakBtn.addEventListener("click", function () {
                speak(pendingSpeechTitle + ". " + pendingSpeechText);
            });
        });

        async function loadLettersFile() {
            try {
                const response = await fetch("buchstaben.json", { cache: "no-store" });
                if (response.ok) {
                    lettersData = JSON.parse(await response.text());
                } else {
                    lettersData = defaultLetters;
                }
            } catch (e) {
                lettersData = defaultLetters;
            }
        }

        // ---------------------------------------------------------------
        // Hilfsfunktionen für requiredItem / requiredItemNot / requiredFlag
        // und addItem / removeItem / setFlag
        // ---------------------------------------------------------------
        function toArray(v) {
            if (v === undefined || v === null) return [];
            return Array.isArray(v) ? v : [v];
        }

        function normalizeFlag(f) {
            // "name" -> {name, value:1} ; {name, value} -> unverändert (value default 1)
            if (typeof f === "string") return { name: f, value: 1 };
            return { name: f.name, value: (f.value === undefined ? 1 : f.value) };
        }

        // Prüft alle Bedingungen eines Eintrags (Choice oder Item). Gibt bei Erfolg true zurück,
        // sonst false + eine Liste an Gründen (für die "(Benötigt: ...)"-Anzeige bei Choices).
        function checkConditions(entry) {
            const reasons = [];

            toArray(entry.requiredItem).forEach(function (itemId) {
                if (!gameState.inventory.includes(itemId)) reasons.push("Benötigt: " + itemDisplayName(itemId));
            });

            toArray(entry.requiredItemNot).forEach(function (itemId) {
                if (gameState.inventory.includes(itemId)) reasons.push("Nicht möglich mit: " + itemDisplayName(itemId));
            });

            toArray(entry.requiredFlag).forEach(function (f) {
                const norm = normalizeFlag(f);
                const current = gameState.flags[norm.name] === undefined ? 0 : gameState.flags[norm.name];
                if (current !== norm.value) reasons.push("Bedingung nicht erfüllt");
            });

            return { met: reasons.length === 0, reasons: reasons };
        }

        // Wendet addItem / removeItem / setFlag eines Choice-Eintrags an
        function applyActions(entry) {
            toArray(entry.addItem).forEach(function (itemId) {
                if (!gameState.inventory.includes(itemId)) gameState.inventory.push(itemId);
            });
            toArray(entry.removeItem).forEach(function (itemId) {
                const idx = gameState.inventory.indexOf(itemId);
                if (idx !== -1) gameState.inventory.splice(idx, 1);
            });
            toArray(entry.setFlag).forEach(function (f) {
                const norm = normalizeFlag(f);
                gameState.flags[norm.name] = norm.value;
            });
        }

        // Anzeigename für ein Item: nutzt adventureData.itemNames[id] falls vorhanden, sonst die id selbst
        function itemDisplayName(itemId) {
            if (adventureData && adventureData.itemNames && adventureData.itemNames[itemId]) {
                return adventureData.itemNames[itemId];
            }
            return itemId;
        }

        // ---------------------------------------------------------------
        // Abenteuer wechseln / laden
        // ---------------------------------------------------------------
        window.changeAdventure = function (folderName) {
            currentAdventureFolder = folderName;

            // Setzt den Spielstand für das neu gewählte Abenteuer direkt auf den Start zurück
            gameState = { currentRoom: "1", inventory: [], flags: {} };
            saveGame();

            // Lädt die Datei und startet das Spiel visuell sofort neu
            loadAdventureFile();
        };

        window.resetGame = function () {
            localStorage.removeItem('vibe_save_' + currentAdventureFolder);
            gameState = { currentRoom: (adventureData.start || "1"), inventory: [], flags: {} };
            saveGame();
            renderRoom();
        };

        // Öffnet die Zielseite eines Items (funktioniert wie ein Ortswechsel)
        window.openItemPage = function (targetId) {
            if (adventureData[targetId]) {
                gameState.currentRoom = targetId;
                saveGame();
                renderRoom();
            }
        };

        window.goToRoom = function (roomId) {
            if (adventureData[roomId]) {
                gameState.currentRoom = roomId;
                saveGame();
                renderRoom();
            }
        };

        // Lädt die abenteuer.json (und die buchstaben.json) dynamisch und rendert den Raum sofort nach Erfolg
        async function loadAdventureFile() {
            await loadLettersFile();
            try {
                const url = currentAdventureFolder + '/abenteuer.json';
                const response = await fetch(url, { cache: "no-store" });
                if (response.ok) {
                    const textData = await response.text();
                    adventureData = JSON.parse(textData);
                    console.log(currentAdventureFolder + "/abenteuer.json erfolgreich gelesen.");
                } else {
                    console.log("Ordner oder Datei nicht gefunden (HTTP " + response.status + "). Nutze Backup-Skript.");
                    adventureData = defaultAdventure;
                }
            } catch (e) {
                console.log("Formatfehler im JSON des gewählten Abenteuers, oder Netzwerkfehler. Nutze Backup.", e);
                adventureData = defaultAdventure;
            }
            initGame();
        }

        function initGame() {
            // Dropdown-Menü visuell auf den richtigen Ordner einstellen
            const selectEl = document.getElementById("adventure-select");
            if (selectEl) {
                selectEl.value = currentAdventureFolder;
            } else {
                const fallbackSelect = document.querySelector("select");
                if (fallbackSelect) fallbackSelect.value = currentAdventureFolder;
            }

            const savedState = localStorage.getItem('vibe_save_' + currentAdventureFolder);
            if (savedState) {
                try {
                    gameState = JSON.parse(savedState);
                    if (!gameState.flags) gameState.flags = {};
                    if (!gameState.inventory) gameState.inventory = [];
                } catch (e) {
                    gameState = { currentRoom: (adventureData.start || "1"), inventory: [], flags: {} };
                }
            } else {
                gameState = { currentRoom: (adventureData.start || "1"), inventory: [], flags: {} };
            }

            if (!adventureData || !adventureData[gameState.currentRoom]) {
                gameState.currentRoom = adventureData.start || "1";
            }
            renderRoom();
        }

        function saveGame() {
            localStorage.setItem('vibe_save_' + currentAdventureFolder, JSON.stringify(gameState));
        }

        // SICHERE RENDER-FUNKTION: Erschafft Elemente selbst, falls sie fehlen
        function renderRoom() {
            const room = adventureData[gameState.currentRoom];
            if (!room) return;

            // 1. Titel sicher setzen
            let titleEl = document.getElementById("room-title");
            if (!titleEl) {
                titleEl = document.createElement("h1");
                titleEl.id = "room-title";
                document.getElementById("story-area").prepend(titleEl);
            }
            titleEl.innerText = replacePlaceholders(room.title || "Raum");
            titleEl.style.display = "none"; // Titel wird vorgelesen, nicht angezeigt

            // 2. Text sicher setzen
            let textEl = document.getElementById("room-text");
            if (!textEl) {
                textEl = document.createElement("p");
                textEl.id = "room-text";
                textEl.className = "story-text";
                titleEl.after(textEl);
            }
            let processedText = room.text || "";
            // optionale dynamische Textzusätze (z.B. je nach Item/Flag ein Extra-Satz anhängen)
            if (room.textConditional) {
                room.textConditional.forEach(function (cond) {
                    if (checkConditions(cond).met) processedText += " " + cond.text;
                });
            }
            processedText = replacePlaceholders(processedText);
            textEl.innerText = processedText;
            textEl.style.display = "none"; // Text wird vorgelesen, nicht angezeigt

            // Für die Sprachausgabe merken und Buchstaben-Quiz für diesen Raum starten
            pendingSpeechTitle = replacePlaceholders(room.title || "");
            pendingSpeechText = processedText;
            startNewQuiz();

            // 3. Bild sicher verwalten (inklusive Unterordner-Pfad)
            const imgElement = document.getElementById("room-image");
            if (imgElement) {
                if (room.image && room.image.trim() !== "") {
                    imgElement.src = currentAdventureFolder + "/" + room.image;
                    imgElement.style.display = "block";
                } else {
                    imgElement.style.display = "none";
                }
            }

            // 4. Inventar anzeigen
            const invList = document.getElementById("inventory-list");
            if (invList) {
                invList.innerText = gameState.inventory.length === 0
                    ? "Leer"
                    : gameState.inventory.map(itemDisplayName).join(", ");
            }

            // 5. Items im Raum verwalten – jedes Item ist ein klickbarer Link, der eine
            //    eigene Seite (Bild/Text/Choices) öffnet, genau wie ein Ort.
            //    Items können requiredItem / requiredItemNot / requiredFlag nutzen, um sich
            //    z.B. selbst auszublenden, sobald sie im Inventar liegen.
            const itemsContainer = document.getElementById("room-items-container");
            if (itemsContainer) {
                itemsContainer.innerHTML = "";
                const roomItems = room.items || [];
                const availableItems = roomItems.filter(function (item) {
                    // Rückwärtskompatibilität: einfache String-Items ("Schlüssel") werden
                    // automatisch ausgeblendet, sobald sie im Inventar sind.
                    if (typeof item === "string") {
                        return !gameState.inventory.includes(item);
                    }
                    return checkConditions(item).met;
                });

                if (availableItems.length > 0) {
                    itemsContainer.style.display = "block";
                    availableItems.forEach(function (item) {
                        const itemDiv = document.createElement("div");

                        if (typeof item === "string") {
                            // Altes einfaches Format: direkt aufnehmbar per Button
                            itemDiv.innerHTML = "Hier liegt: <strong>" + replacePlaceholders(item) + "</strong> ";
                            const btn = document.createElement("button");
                            btn.className = "item-link";
                            btn.textContent = "[Aufheben]";
                            btn.onclick = function () {
                                if (!gameState.inventory.includes(item)) {
                                    gameState.inventory.push(item);
                                    saveGame();
                                    renderRoom();
                                }
                            };
                            itemDiv.appendChild(btn);
                        } else if (item.target && adventureData[item.target]) {
                            // Neues Format: Item ist ein Link zu einer eigenen Item-Seite
                            const link = document.createElement("button");
                            link.className = "item-link";
                            link.textContent = replacePlaceholders(item.text) || itemDisplayName(item.id);
                            link.onclick = function () { window.openItemPage(item.target); };
                            itemDiv.appendChild(link);
                        } else {
                            // Objekt-Item ohne target: direkt per Klick aufnehmbar
                            const link = document.createElement("button");
                            link.className = "item-link";
                            link.textContent = (replacePlaceholders(item.text) || itemDisplayName(item.id)) + " [Aufheben]";
                            link.onclick = function () {
                                if (!gameState.inventory.includes(item.id)) {
                                    gameState.inventory.push(item.id);
                                    saveGame();
                                    renderRoom();
                                }
                            };
                            itemDiv.appendChild(link);
                        }

                        itemsContainer.appendChild(itemDiv);
                    });
                } else {
                    itemsContainer.style.display = "none";
                }
            }

            // 6. Entscheidungen bauen (requiredItem / requiredItemNot / requiredFlag,
            //    sowie addItem / removeItem / setFlag beim Klick)
            const choicesContainer = document.getElementById("choices-container");
            if (choicesContainer) {
                choicesContainer.innerHTML = "";
                const choices = room.choices || [];

                const visibleChoices = choices.filter(function (choice) {
    return checkConditions(choice).met;
});

visibleChoices.forEach(function (choice) {
    const button = document.createElement("button");
    button.className = "btn-choice";
    button.innerText = replacePlaceholders(choice.text);

    button.onclick = function () {
        applyActions(choice);
        saveGame();
        if (choice.target) {
            window.goToRoom(choice.target);
        } else {
            renderRoom();
        }
    };
    choicesContainer.appendChild(button);
});

if (visibleChoices.length === 0) {
                    const hint = document.createElement("p");
                    hint.className = "no-choices-hint";
                    hint.textContent = "Es gibt hier nichts weiter zu tun.";
                    choicesContainer.appendChild(hint);
                }
            }
        }

        window.onload = function () {
            loadGirlNamesFile().then(function () {
                runNameSetup(loadAdventureFile);
            });
        };
    </script>
</body>
</html>
